name: Images

# Build -> scan -> (main/tags only) push, SBOM, sign, attest.
#
# Branch model: develop = staging, main = release line, v* tags = production.
#   PRs:                  build + Trivy gate, nothing pushed, no credentials.
#   develop, main, v* tag: push to GHCR as sha-<full commit sha> (+ branch / semver),
#                 Syft SPDX SBOM (artifact + attestation), cosign keyless
#                 signature, SLSA build provenance attestation.
#
# Verify a published image:
#   cosign verify ghcr.io/<owner>/<repo>-backend:sha-<sha> \
#     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/.github/workflows/images.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/<owner>/<repo>-backend:sha-<sha> --owner <owner>

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write          # push to GHCR (main/tags only)
      id-token: write          # cosign keyless + attestations (OIDC)
      attestations: write      # SLSA provenance + SBOM attestations
      security-events: write   # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: Backend/Dockerfile
          - image: frontend
            context: .
            dockerfile: Frontend/Dockerfile
          - image: edge
            context: infra/edge
            dockerfile: infra/edge/Dockerfile
          - image: models
            context: Models
            dockerfile: Models/Dockerfile
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name
        id: meta0
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
        run: |
          if [ ! -f "$DOCKERFILE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=$IMAGE::$DOCKERFILE not present yet; image skipped."
            exit 0
          fi
          {
            echo "skip=false"
            echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-$IMAGE"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.meta0.outputs.skip == 'false'

      - name: Docker metadata
        id: meta
        if: steps.meta0.outputs.skip == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.meta0.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # 1) Build once into the local daemon for scanning (amd64, cached).
      - name: Build (local, for scanning)
        if: steps.meta0.outputs.skip == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: devhq-${{ matrix.image }}:scan
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta0.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # 2) Gate: fail on HIGH/CRITICAL vulnerabilities that have a fix.
      - name: Trivy image scan (gate)
        if: steps.meta0.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devhq-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          scanners: vuln,secret,misconfig

      - name: Trivy image scan (SARIF)
        if: always() && steps.meta0.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devhq-${{ matrix.image }}:scan
          severity: MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload Trivy SARIF
        if: always() && steps.meta0.outputs.skip == 'false' && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}

      # 3) Publish (develop / main / v* tags only).
      - name: Log in to GHCR
        if: env.PUSH == 'true' && steps.meta0.outputs.skip == 'false'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        if: env.PUSH == 'true' && steps.meta0.outputs.skip == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta0.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: false   # SLSA provenance comes from attest-build-provenance below
          sbom: false         # SBOM comes from Syft below

      - name: SBOM (Syft, SPDX JSON)
        if: env.PUSH == 'true' && steps.meta0.outputs.skip == 'false'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta0.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-release-assets: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUSH == 'true' && steps.meta0.outputs.skip == 'false'

      - name: Sign image (cosign keyless, by digest)
        if: env.PUSH == 'true' && steps.meta0.outputs.skip == 'false'
        env:
          REF: ${{ steps.meta0.outputs.name }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest SBOM
        if: env.PUSH == 'true' && steps.meta0.outputs.skip == 'false'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.meta0.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA)
        if: env.PUSH == 'true' && steps.meta0.outputs.skip == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta0.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
